<!DOCTYPE html>
<html lang="es">
<head><meta http-equiv="refresh" content="1800">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copa Belgrano · Resultados</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
--celeste:#3A9CD0;--negro:#1D1D1B;--c50:#F0F8FD;--c100:#DCEEF9;--c200:#B6DCF1;--c300:#85C4E5;--c600:#2E7EAA;--c700:#236084;
--n50:#F7F7F6;--n100:#EFEFED;--n200:#E1E1DE;--n300:#C7C7C3;--n400:#9A9A95;--n500:#75756F;--n600:#55554F;--n800:#292927;
--verde:#2E8B57;--verde100:#E3F2E9;--ambar:#D89B1C;--ambar100:#FBF1DA;--rojo:#C0392B;--rojo100:#F8E4E1;
--focus:rgba(58,156,208,.45);--fd:"Anton","Barlow Condensed",Impact,sans-serif;--fb:"Barlow","Helvetica Neue",Arial,sans-serif;--fc:"Barlow Condensed","Barlow",Arial,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 var(--fb);color:var(--n800);background:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--fd);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.01em;color:var(--negro)}
h2{font-size:30px;margin:34px 0 4px}h3{font-size:21px;margin:20px 0 8px}
.rule{display:block;width:56px;height:4px;background:var(--celeste);margin:8px 0 14px}
.eyebrow{font-family:var(--fc);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c600)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{vertical-align:-3px;flex:none}
header{background:var(--negro);color:#fff;border-bottom:4px solid var(--celeste)}
header .t{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:48px;display:block}header img.lg{height:58px}.plano{width:100%;height:auto;border:1px solid var(--n200);border-radius:6px}.bs h3{margin-top:22px}.bs p,.bs li{max-width:78ch}
header h1{color:#fff;font-size:34px}
header .eyebrow{color:var(--c300)}
.sp{flex:1}
nav{background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--n200);overflow-x:auto;white-space:nowrap}
nav .in{max-width:1200px;margin:0 auto;display:flex;gap:24px;padding:0 20px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 0 11px;font:600 16px var(--fc);text-transform:uppercase;letter-spacing:.03em;color:var(--n500);cursor:pointer;transition:color .09s}
nav button:hover{color:var(--negro)}nav button.on{color:var(--negro);border-bottom-color:var(--celeste)}
main{max-width:1200px;margin:0 auto;padding:8px 20px 72px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--n300);background:#fff;border-radius:4px;padding:0 12px;height:32px;cursor:pointer;font:600 14px var(--fc);text-transform:uppercase;letter-spacing:.04em;color:var(--negro);transition:all .09s}
.chip:hover{border-color:var(--negro)}.chip.on{background:var(--negro);color:#fff;border-color:var(--negro)}
input[type=text],input[type=search],input[type=number],select,textarea{font:inherit;font-size:15px;height:40px;padding:0 12px;border:1px solid var(--n300);border-radius:4px;background:#fff;color:var(--negro);max-width:100%}
textarea{height:auto;padding:8px 12px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--celeste)}
.card{background:#fff;border:1px solid var(--n200);border-radius:6px;padding:16px;margin:10px 0}
.card.m{background:var(--n50)}
.mc{background:#fff;border:1px solid var(--n200);border-left:4px solid var(--n300);border-radius:6px;padding:10px 14px;margin:8px 0;transition:border-color .09s}
.mc.clk{cursor:pointer}.mc.clk:hover{border-color:var(--n400)}
.mc.s-fin{border-left-color:var(--verde)}.mc.s-live{border-left-color:var(--celeste);background:var(--c50)}.mc.s-susp{border-left-color:var(--rojo)}
.mh{display:flex;gap:10px;flex-wrap:wrap;font:500 13px var(--fc);letter-spacing:.04em;text-transform:uppercase;color:var(--n500);align-items:center}
.code{font-weight:700;color:var(--negro);background:var(--n100);border-radius:2px;padding:1px 7px}
.bdg{border-radius:2px;padding:1px 8px;font:600 12px var(--fc);letter-spacing:.06em;text-transform:uppercase;color:var(--negro);border:1px solid rgba(29,29,27,.08)}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0 2px}
.mt .tn{font-weight:600;font-size:16px;color:var(--negro)}.mt .tn:last-child{text-align:right}
.mt .tn.win{color:var(--c700)}.mt .tn.ph{color:var(--n500);font-weight:400;font-style:italic}
.sc{font:700 26px/1 var(--fc);min-width:72px;text-align:center;background:var(--n100);border-radius:4px;padding:5px 10px;white-space:nowrap;letter-spacing:.02em}
.mf{font-size:13px;color:var(--n500);display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:2px;font:600 12px var(--fc);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.p-live{background:var(--celeste);color:#fff}.p-fin{background:var(--verde100);color:#1F6640}.p-susp{background:var(--rojo100);color:#8E2A1F}.p-pend{background:var(--n100);color:var(--n600)}
.p-oro{background:var(--ambar100);color:#8A6110}.p-pla{background:var(--n200);color:var(--n800)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.warn{color:var(--rojo);font-size:13px;font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11.5px var(--fc);letter-spacing:.14em;text-transform:uppercase;color:var(--n500);text-align:center;padding:10px 6px;border-bottom:2px solid var(--negro);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--n200);text-align:center;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:transparent}
th.l,td.l{text-align:left}td.l{font-weight:500;color:var(--negro)}
tr.q-oro td:first-child{box-shadow:inset 4px 0 var(--ambar)}tr.q-pla td:first-child{box-shadow:inset 4px 0 var(--n400)}
.grid{display:grid;gap:16px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.bar{height:8px;background:var(--n200);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--celeste);transition:width .42s cubic-bezier(.2,.6,.2,1)}
.mut{color:var(--n500);font-size:14px}
.stat{font:400 44px/1 var(--fd);color:var(--negro)}
.br{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}.br .col{min-width:270px;flex:1}
.br h4{font:600 12px var(--fc);letter-spacing:.14em;text-transform:uppercase;color:var(--n500);margin:6px 0}
.gt td{vertical-align:top;font-size:12.5px;padding:5px;min-width:150px;text-align:left}
.gt th.h{position:sticky;left:0;background:#fff;z-index:1}
.gt .cell{border-radius:2px;padding:5px 7px;margin-bottom:4px;line-height:1.25;border-left:3px solid var(--n400)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;background:var(--celeste);color:#fff;border:1px solid transparent;border-radius:4px;font:600 15px var(--fc);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:all .09s;white-space:nowrap}
.btn:hover{background:var(--c600)}.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--negro);border-color:var(--negro)}.btn.sec:hover{background:var(--negro);color:#fff}
.btn.gh{background:transparent;color:var(--c600);border-color:transparent}.btn.gh:hover{background:var(--c50);color:var(--c700)}
.btn.red{background:var(--rojo);color:#fff}.btn.red:hover{background:#A62F23}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4;pointer-events:none}
.sw{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--n600);border-radius:4px;color:#fff;font:600 14px var(--fc);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
.sw.on{background:var(--celeste);border-color:var(--celeste)}
.ib{background:none;border:0;color:var(--n400);cursor:pointer;padding:2px 4px;border-radius:2px}.ib:hover{color:var(--c600);background:var(--c50)}
#modal{position:fixed;inset:0;background:rgba(29,29,27,.72);backdrop-filter:saturate(140%) blur(14px);display:none;z-index:20;overflow-y:auto}
#modal.on{display:block}
.sheet{background:#fff;max-width:660px;margin:20px auto;border-radius:6px;padding:22px;position:relative;box-shadow:0 18px 44px rgba(29,29,27,.18)}
.sheet h3{margin:0 0 4px}
.fld{margin:12px 0}.fld label{display:block;font:600 11.5px var(--fc);letter-spacing:.14em;text-transform:uppercase;color:var(--n500);margin-bottom:4px}
.stbtn{display:flex;gap:6px;flex-wrap:wrap}.stbtn .btn{flex:1;min-width:92px}
.scr{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:10px 0}
.scr .tm{font-weight:700;color:var(--negro)}.scr .tm:last-child{text-align:right}
.big{display:flex;align-items:center;gap:6px;justify-content:center}
.big button{width:44px;height:44px;border-radius:4px;border:1px solid var(--n300);background:#fff;font:600 24px var(--fc);cursor:pointer;color:var(--negro)}.big button:hover{background:var(--negro);color:#fff}
.big input{width:64px;height:44px;text-align:center;font:700 26px var(--fc)}
.lr{display:flex;gap:6px;margin:5px 0;align-items:center;flex-wrap:wrap}.lr input[type=text]{flex:1;min-width:110px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 18px;border-radius:4px;font:600 14px var(--fc);letter-spacing:.04em;text-transform:uppercase;z-index:30;display:none}
.banner{background:var(--ambar100);border-left:4px solid var(--ambar);padding:10px 14px;margin:12px 0;font-size:14px}
.empty{color:var(--n500);padding:28px;text-align:center}
.sq{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.rn{display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n200)}
@media(max-width:600px){header h1{font-size:26px}.rn{grid-template-columns:1fr}}
</style>
</head>

    rank.forEach((r,i)=>{const n=rank[i+1];if(n&&r.pj>0&&n.pos===r.pos&&per(n,'pts')===per(r,'pts')&&per(n,'dgc')===per(r,'dgc')&&per(n,'gf')===per(r,'gf')&&!so&&(i+1===b.oro||i+1===b.oro+b.plata)){r.rtie=true;n.rtie=true}});
    const done=zm.every(isFin),forced=!!(OV['close_'+b.tag]||{}).on;
    out[b.tag]={zones,rank,done,forced,definitive:done||forced,nz:zm.length,nzf:zm.filter(isFin).length,cups:{Oro:rank.slice(0,b.oro).map(r=>r.team),Plata:rank.slice(b.oro,b.oro+b.plata).map(r=>r.team)}};
  }
  return out;
}
function scorers(tag){
  const mp={};
  MS.forEach(m=>{if(tag&&m.b!==tag)return;const r=R(m);if(!r.goals)return;const t=teamsOf(m);
    r.goals.forEach(g=>{if(g.og||!g.p||!g.p.trim())return;const team=t[g.t],k=m.b+'|'+team+'|'+g.p.trim().toLowerCase();(mp[k]=mp[k]||{p:g.p.trim(),team,b:m.b,n:0}).n++})});
  return Object.values(mp).sort((a,b)=>b.n-a.n||a.p.localeCompare(b.p));
}
function goalsCount(m){const r=R(m);const c=[0,0];(r.goals||[]).forEach(g=>{c[g.og?1-g.t:g.t]++});return c}
function mismatch(m){const r=R(m);if(!r.goals||!r.goals.length||r.ga===undefined)return false;const c=goalsCount(m);return c[0]!==+r.ga||c[1]!==+r.gb}
function restWarns(){
  const w=[],byT={};
  MS.forEach(m=>{teamsOf(m).forEach((t,i)=>{if(isPh(m,i))return;if(!B[m.b].zones.some(z=>z.teams.includes(t)))return;(byT[m.b+'|'+t]=byT[m.b+'|'+t]||[]).push(m)})});
  for(const k in byT){const l=byT[k].slice().sort((a,b)=>(a.day-b.day)||(mins(a)-mins(b)));
    for(let i=0;i<l.length-1;i++){const a=l[i],b=l[i+1];if(a.day===b.day&&mins(b)-mins(a)<80)w.push({team:k.split('|')[1],a:a.code,b:b.code,blk:a.b})}}
  return w;
}

function matchCard(m,opt={}){

  <div class="mf">${r.ref?`<span>Árbitro: ${esc(r.ref)}</span>`:''}${draw}${same}${mismatch(m)?'<span class="warn">Los goleadores no coinciden con el resultado</span>':''}${r.note?`<span>${esc(r.note)}</span>`:''}</div></div>`;

function vBases(){const P=(t,b)=>`<h3>${t}</h3>${b}`;
return sec('Bases y condiciones','Copa Belgrano 2026')+`<div class="bs">
${P('Categorías','<p>Sub-17 (2009, 2010 y 2011) y 2012/13: fútbol 9. 2014/15, 2016/17 y 2018/19: fútbol 7. 2020/21: fútbol 5. Cada jugador compite en la categoría de su año de nacimiento; se puede subir de categoría con pedido formal de la institución, nunca bajar. Solo juegan los jugadores de la lista de buena fe (máximo 14 en fútbol 9, 12 en fútbol 7 y 10 en fútbol 5).</p>')}
${P('Reglas de juego','<ul><li>Dos tiempos de 15 minutos. Cambios libres con autorización del árbitro, con reingreso.</li><li>Saques de arco desde el suelo en fútbol 7 y 9. En fútbol 5, con la mano o el pie, del suelo o del aire.</li><li>Barrera a 7 metros. No hay posición adelantada.</li><li>Mínimo para jugar: 7 en fútbol 9, 5 en fútbol 7 y 4 en fútbol 5.</li><li>Pelota número 4 en fútbol 5 y 7, y número 5 en fútbol 9.</li></ul>')}
${P('Desempate y clasificación','<p>Con igualdad de puntos: 1) puntos en los partidos entre los equipos involucrados, 2) diferencia de gol, 3) goles a favor, 4) sorteo. En las llaves, si hay empate se patean 3 penales por equipo, alternados, y luego uno por equipo hasta desempatar. No hay alargue.</p>')}
${P('Horarios y presentación','<p>Cada equipo debe estar en la cancha 10 minutos antes, con una tolerancia máxima de 5. Pasado ese plazo se puede dar el partido por perdido 0-3. Si hay demoras, la organización puede acortar los tiempos o el entretiempo.</p>')}
${P('Suspensiones','<p>Ante clima, estado del campo o seguridad, la organización puede suspender, reprogramar o dar por finalizados los partidos. Si un partido se suspende por una causa atribuible a un equipo, el rival gana 3-0.</p>')}
${P('Disciplina','<p>El árbitro decide las expulsiones y sanciones, y las tarjetas no se acumulan entre partidos. La organización puede suspender a un jugador por una conducta grave. Los espectadores deben quedarse en los sectores habilitados.</p>')}

${P('Evento','<p>Sábado 21 y domingo 22 de noviembre, en el Centro Integral de Formación Deportiva «Armando Pérez», Villa Esquiú. Los portones abren a las 7:00. La acreditación se hace en la zona de vestuarios, una hora antes del primer partido de cada equipo. La premiación es en vestuarios al terminar el último partido de cada equipo.</p>')}

${P('Seguimiento','<p>Los fixtures, resultados, horarios y canchas también pueden seguirse por la aplicación TIMBO.</p>')}
</div>`}
function vCarga(){
  if(!canEdit)return'<div class="empty">Esta sección es solo para la organización.</div>';
  const warn=[];
  restWarns().forEach(w=>warn.push(`<b>${esc(dn(w.blk,w.team))}</b> (${esc(bname(w.blk))}) juega ${w.a} y ${w.b} con menos de 40 minutos de descanso. Cambiá el horario de uno de los dos.`));
  DATA.blocks.forEach(b=>{const st=ST[b.tag];
    if(st.zones.some(z=>z.rows.some(r=>r.tie))||st.rank.some(r=>r.rtie))warn.push(`<b>${esc(b.name)}</b>: hay empates totales (puntos, resultado directo, DG y goles a favor). <button class="btn sm sec" data-act="sorteo" data-b="${b.tag}">Sortear desempates</button>`);
    if(st.done&&!(OV['close_'+b.tag]||{}).on)warn.push(`<b>${esc(b.name)}</b>: terminaron todos los partidos de zona y las llaves ya están definidas.`);
  });
  MS.filter(m=>m.a===undefined&&isFin(m)&&winner(m)===null).forEach(m=>warn.push(`<b>${m.code}</b> terminó empatado: cargá los penales.`));
  MS.filter(mismatch).forEach(m=>warn.push(`<b>${m.code}</b>: los goleadores cargados no coinciden con el resultado.`));
  let h=sec('Control de la organización','Solo para quienes cargan')+`<h3>Alertas</h3>`+(warn.length?warn.map(w=>`<div class="card">${w}</div>`).join(''):'<div class="card">No hay alertas por ahora.</div>');
  const fx=MS.filter(m=>m.fx&&!isFin(m)),pr=m=>MS.some(g=>g.b===m.b&&g.a!==undefined&&g.day===1&&slotIdx(g)===slotIdx(m)-1&&teamsOf(m).some((t,i)=>!isPh(m,i)&&(g.a===t||g.c===t)));
  if(fx.length)h+=`<h3>Primeros cruces de llaves</h3><div class="mut">Se arman en el momento. Los que tienen equipos que jugaron en la franja anterior conviene pasarlos a una franja más tarde.</div>`+fx.map(m=>`<div class="card"><b>${m.code}</b> ${DS[m.day]} ${hora(m)} · ${esc(names(m).join(' vs '))} ${pr(m)?'<span class="pill p-susp">Jugó en la franja anterior</span>':'<span class="pill p-fin">Sin conflicto</span>'}</div>`).join('');
  h+=`<h3>Cargar resultado</h3><div class="mut">Próximos partidos sin finalizar. Activá el modo carga arriba para editar.</div>`+MS.filter(m=>!isFin(m)).sort((a,b)=>a.day-b.day||mins(a)-mins(b)).slice(0,8).map(m=>matchCard(m)).join('');
  h+=`<h3>Nombres de equipos</h3><div class="mut">Editá cómo se muestra cada equipo. El cambio se ve al instante en tablas, partidos, llaves y goleadores.</div>${blockChips('nb',false)}<div>${B[ui.nb].zones.flatMap(z=>z.teams.map(t=>({t,z:z.name}))).map(x=>{const cur=dn(ui.nb,x.t);return`<div class="rn"><span class="mut">${x.z} · ${esc(x.t)}</span><b>${esc(cur)}${cur!==x.t?' <span class="pill p-live">Editado</span>':''}</b><button class="btn sec sm" data-act="rename" data-b="${ui.nb}" data-t="${esc(x.t)}">${ic('pencil')} Editar</button></div>`}).join('')}</div>`;
  h+=`<h3>Cierre de zonas</h3><div class="mut">Si un partido de zona no se va a jugar, cerrá la zona para definir las llaves igual.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${DATA.blocks.map(b=>{const on=(OV['close_'+b.tag]||{}).on;return`<button class="btn sm ${on?'':'sec'}" data-act="zclose" data-b="${b.tag}">${on?ic('check')+' ':''}${esc(b.name)} ${ST[b.tag].nzf}/${ST[b.tag].nz}</button>`}).join('')}</div>`;
  h+=`<h3>Página para las familias (GitHub)</h3><div class="mut">Genera el archivo index.html con los resultados y nombres de este momento. En GitHub: Add file, Upload files, subí ese index.html y Commit changes. Reemplaza al anterior, no hace falta borrarlo.</div><button class="btn" data-act="exportsnap" style="margin-top:8px">Descargar index.html actualizado</button>`;
  h+=`<h3>Copia de seguridad</h3><button class="btn sec" data-act="backup">${ic('copy')} Copiar resultados y nombres (JSON)</button>`;
  h+=`<h3>Tarjetas e incidencias</h3>`;
  const inc=[];MS.forEach(m=>(R(m).inc||[]).forEach(i=>inc.push({m,i})));
  h+=inc.length?`<div class="tw"><table><thead><tr><th>Partido</th><th class="l">Equipo</th><th class="l">Jugador</th><th>Tipo</th><th class="l">Nota</th></tr></thead><tbody>${inc.map(x=>`<tr><td>${x.m.code}</td><td class="l">${esc(names(x.m)[x.i.t])}</td><td class="l">${esc(x.i.p||'')}</td><td>${{am:'<i class="sq" style="background:var(--ambar)"></i>Amarilla',ro:'<i class="sq" style="background:var(--rojo)"></i>Roja',les:'Lesión',otra:'Otra'}[x.i.k]||''}</td><td class="l">${esc(x.i.n||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="mut">Sin incidencias cargadas.</div>';
  return h;
}

  modal.innerHTML=`<div class="sheet"><div class="eyebrow">${m.code} · ${DAYS[m.day]} · ${hora(m)} · Cancha ${cancha(m)}</div><h3>${esc(phase(m))}</h3><div>${chipB(m.b)}</div>

async function save(){
  const code=D._m,out=JSON.parse(JSON.stringify(D));delete out._m;
  ['ga','gb','pa','pb'].forEach(k=>{const v=num(out[k]);if(v===null)delete out[k];else out[k]=v});
  if(out.st==='fin'||out.st==='live'){if(out.ga===undefined)out.ga=0;if(out.gb===undefined)out.gb=0}
  if(!out.ref)delete out.ref;if(!out.hr)delete out.hr;if(!out.fd)delete out.fd;else out.fd=+out.fd;if(!out.note)delete out.note;if(!out.ovA)delete out.ovA;if(!out.ovC)delete out.ovC;
  out.goals=(out.goals||[]).filter(g=>g.p&&g.p.trim()||g.og);out.inc=(out.inc||[]).filter(i=>i.p||i.n||i.k);
  out.ts=Date.now();
  try{await dbh.doc('matches/'+code).set(out);RES[code]=out;closeModal();render();toast('Guardado')}
  catch(e){document.getElementById('merr').textContent='No pudimos guardar ('+(e&&e.code||'error')+'). Revisá que tengas permiso de edición.'}
}

async function saveName(tag,id,val){
  const map=Object.assign({},NM[tag]||{});val=(val||'').trim().replace(/\s+/g,' ');
  const err=document.getElementById('merr');
  if(val===''){err.textContent='El nombre no puede quedar vacío.';return}
  const dup=B[tag].zones.flatMap(z=>z.teams).find(x=>x!==id&&dn(tag,x).toLowerCase()===val.toLowerCase());
  if(dup){err.textContent='Ya hay otro equipo con ese nombre en esta categoría.';return}
  if(val===id)delete map[id];else map[id]=val;
  try{await dbh.doc('ov/names_'+tag).set({map});OV['names_'+tag]={map};closeModal();render();toast('Nombre actualizado')}
  catch(e){err.textContent='No pudimos guardar el nombre. Revisá que tengas permiso de edición.'}
}

/* ---------- textos para copiar ---------- */
function exportSnap(){
  if(!TPL){toast('Solo disponible en el tablero');return}
  const bin=atob(TPL),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  let h=new TextDecoder().decode(u);
  const at=new Date().toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',','');
  const js=JSON.stringify({at:at,res:RES,ov:OV}).replace(/</g,'\\u003c');
  h=h.replace('/*SNAP'+'DATA*/null',()=>js);
  claude.use('downloads').then(dl=>{
    if(!dl){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('index.html listo: subilo a GitHub');return}
    return dl.save({filename:'index.html',data:h}).then(()=>toast('index.html guardado: subilo a GitHub'),er=>{if(!er||er.code!=='declined')toast('No se pudo guardar el archivo')});
  }).catch(()=>toast('No se pudo guardar el archivo'));
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){modal.innerHTML=`<div class="sheet"><h3>Copiá este texto</h3><textarea rows="12" style="width:100%" id="ct">${esc(t)}</textarea><div style="margin-top:12px"><button class="btn" data-act="close">Cerrar</button></div></div>`;modal.classList.add('on');setTimeout(()=>{const e=document.getElementById('ct');e&&e.select()},50)}}
function txtZones(){const b=B[ui.block],st=ST[ui.block];return`*COPA BELGRANO · ${b.name}* (posiciones${st.definitive?'':' provisorias'})\n`+st.zones.map(z=>`\n*${z.name}*\n`+z.rows.map(r=>`${r.pos}. ${dn(b.tag,r.team)} · ${r.pts} pts (${r.pj} PJ, DG ${r.dgc>0?'+':''}${r.dgc})`).join('\n')).join('\n')}
function txtRank(){const b=B[ui.block],st=ST[ui.block];const f=c=>st.rank.filter(r=>r.cup===c).map(r=>`${r.rk}. ${dn(b.tag,r.team)}`).join('\n');return`*COPA BELGRANO · ${b.name}* (clasificación${st.definitive?'':' provisoria'})\n\n*Copa de Oro*\n${f('Oro')}\n\n*Copa de Plata*\n${f('Plata')}`}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  if(e.target===modal){closeModal();return}
  const a=e.target.closest('[data-act]');if(!a||a.tagName==='SELECT'||a.tagName==='INPUT')return;
  const act=a.dataset.act,d=a.dataset;
  if(act==='rename'){e.stopPropagation();openRename(d.b,d.t);return}
  switch(act){
    case'tab':ui.tab=d.v;location.hash=d.v;render();window.scrollTo(0,0);break;
    case'set':ui[d.k]=d.v;render();break;
    case'gday':ui.gday=+d.v;render();break;
    case'edit':ui.edit=!ui.edit;render();break;
    case'open':openMatch(d.code);break;
    case'close':closeModal();break;
    case'pickteam':ui.team={t:d.t,b:d.b,z:d.z};render();break;
    case'clearteam':ui.team=null;ui.tq='';render();break;
    case'copyz':copyText(txtZones());break;
    case'copyr':copyText(txtRank());break;
    case'exportsnap':exportSnap();break;
    case'backup':copyText(JSON.stringify({resultados:RES,ajustes:OV}));break;
    case'rnsave':saveName(d.b,d.t,document.getElementById('rn').value);break;
    case'rnreset':saveName(d.b,d.t,d.t);break;
    case'sorteo':{const t=B[d.b].zones.flatMap(z=>z.teams).slice();for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]]}setOv('sorteo_'+d.b,{order:t});break}
    case'zclose':setOv('close_'+d.b,{on:!(OV['close_'+d.b]||{}).on});break;
    default:if(D){
      if(act==='dst'){D.st=d.v;drawEdit()}
      else if(act==='gm'){D[d.s]=Math.max(0,(num(D[d.s])??0)+ +d.d);drawEdit()}
      else if(act==='wo'){D.st='fin';D.goals=[];D.ga=d.v==='0'?0:3;D.gb=d.v==='0'?3:0;D.note=((D.note||'')+' Falta de presentación (0-3).').trim();drawEdit()}
      else if(act==='addgoal'){D.goals.push({t:+d.t,p:''});drawEdit()}
      else if(act==='rmgoal'){D.goals.splice(+d.k,1);drawEdit()}
      else if(act==='addinc'){D.inc.push({t:0,k:'am',p:'',n:''});drawEdit()}
      else if(act==='rminc'){D.inc.splice(+d.k,1);drawEdit()}
      else if(act==='save'){save()}
      else if(act==='clear'){try{await dbh.doc('matches/'+D._m).delete();delete RES[D._m];closeModal();render();toast('Resultado borrado')}catch(_){document.getElementById('merr').textContent='No pudimos borrar el resultado.'}}
    }
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rn'){const b=document.querySelector('[data-act=rnsave]');b&&b.click()}if(e.key==='Escape'&&modal.classList.contains('on'))closeModal()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='sel'){ui[t.dataset.k]=t.value;render();return}
  if(!D||!t.dataset.f)return;applyField(t,true);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.act==='inp'){ui[t.dataset.k]=t.value;if(t.dataset.k==='tq')ui.team=null;render();return}
  if(!D||!t.dataset.f)return;applyField(t,false);
});
function applyField(t,redraw){
  const f=t.dataset.f,k=+t.dataset.k;
  if(f==='goal')D.goals[k].p=t.value;
  else if(f==='og'){D.goals[k].og=t.checked}
  else if(f==='ga'||f==='gb'||f==='pa'||f==='pb'){D[f]=t.value===''?undefined:Math.max(0,+t.value);if(redraw&&(f==='ga'||f==='gb'))drawEdit()}
  else if(f==='it'){D.inc[k].t=+t.value}
  else if(f==='ik'){D.inc[k].k=t.value}
  else if(f==='ip'){D.inc[k].p=t.value}
  else if(f==='in'){D.inc[k].n=t.value}
  else D[f]=t.value;
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&(h!=='carga'||canEdit)){ui.tab=h;render()}});
{const h=location.hash.slice(1);if(VIEWS[h])ui.tab=h}

/* ---------- datos ---------- */
if(SNAP){RES=SNAP.res||{};OV=SNAP.ov||{};loaded=true;render()}
else{
render();
(async()=>{
  let tmr=setTimeout(()=>{if(!loaded){loadSlow=true;render()}},10000);
  try{
    const user=await claude.use('user');
    if(user){const c=await user.can('data.write');canEdit=!!(await user.isOwner()||await user.canEdit()||c===true)}
    const db=await claude.use('db');
    if(!db){dbNull=true;clearTimeout(tmr);render();return}
    dbh=db;
    db.collection('ov').onSnapshot(s=>{OV={};s.docs.forEach(d=>{OV[d.id]=d.data()});render()},()=>{});
    db.collection('matches').onSnapshot(s=>{RES={};s.docs.forEach(d=>{RES[d.id]=d.data()});loaded=true;clearTimeout(tmr);render()},()=>{loadSlow=true;render()});
    render();
  }catch(e){dbNull=true;render()}
})();
}
</script></body></html>
